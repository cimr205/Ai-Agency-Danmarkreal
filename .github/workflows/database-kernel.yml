name: Database kernel

on:
  push:
    branches: [main, master, 'feature/**', 'claude/**']
  pull_request:
    branches: [main, master]

jobs:
  clean-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Start local Supabase
        run: supabase start
      - name: Apply complete migration history
        run: supabase db reset
      - name: Database lint
        run: supabase db lint --local --schema public --level warning --fail-on error
      - name: pgTAP, tenant and kernel contracts
        run: supabase test db
      - name: Concurrency and idempotency
        run: bash supabase/tests/runtime_concurrency.sh
      - name: Tenant REST attack regression
        run: |
          npm ci
          eval "$(supabase status -o env)"
          export VITE_SUPABASE_URL="$API_URL"
          export VITE_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          npx vitest run src/test/tenant-isolation.integration.test.ts
      - name: Generated types are current
        run: |
          supabase gen types typescript --local > /tmp/database.types.ts
          diff -u src/integrations/supabase/types.ts /tmp/database.types.ts
      - name: Upload generated database types
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-database-types
          path: /tmp/database.types.ts
          if-no-files-found: ignore

  update-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase start
      - name: Install realistic pre-kernel schema
        run: supabase db reset --version 20260907000001
      - name: Apply kernel migrations as upgrade
        run: supabase migration up --local
      - name: Verify upgraded schema
        run: supabase test db

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Install npm dependencies required by Deno node imports
        run: npm ci
      - name: Typecheck operating paths
        run: deno check supabase/functions/ai-operating-manager/index.ts supabase/functions/autopilot-execute/index.ts supabase/functions/composio-integration/index.ts supabase/functions/gmail-send/index.ts supabase/functions/gmail-sync/index.ts supabase/functions/meta-sync/index.ts supabase/functions/workflow-runner/index.ts supabase/functions/meta-lead-webhook/index.ts supabase/functions/create-invoice-checkout/index.ts supabase/functions/stripe-payment-webhook/index.ts
      - name: Provider signature fixtures
        run: deno test supabase/functions/_shared/providerSignatures_test.ts supabase/functions/_shared/stripeSignature_test.ts
