# Deploys the backend to production after main is green.
# Vercel only ships the frontend; without this, edge-function and migration
# fixes merged to main never reach aiagencydanmark.dk.
#
# One-time setup (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  – personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   – the production database password
# Until both exist the job skips instead of failing.
name: Deploy Supabase

on:
  workflow_run:
    workflows: ["Database kernel"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: inyrwsygghdjhmqejgwk
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD not set — skipping backend deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ok == 'true'
        with: { version: 2.116.0 }
      - name: Link project
        if: steps.secrets.outputs.ok == 'true'
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply new migrations
        if: steps.secrets.outputs.ok == 'true'
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD"
      - name: Deploy edge functions
        if: steps.secrets.outputs.ok == 'true'
        run: supabase functions deploy --project-ref "$PROJECT_REF"
